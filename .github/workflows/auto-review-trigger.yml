on:
  pull_request_target:
  pull_request_review:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull Request Number
        type: string
        required: true
  issue_comment:
    types:
      - created

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

name: Auto Review Bot Trigger

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    name: Trigger
    steps:
      - name: Determine PR Number
        id: pr
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_TARGET_NUMBER: ${{ github.event.number }}
          PR_REVIEW_NUMBER: ${{ github.event.pull_request.number }}
          DISPATCH_NUMBER: ${{ inputs.pr_number }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          IS_PR_TARGET_ELIGIBLE: ${{ github.event_name == 'pull_request_target' && ((!endsWith(github.event.sender.login, '-bot') && !endsWith(github.event.sender.login, '[bot]')) || github.event.sender.login == 'renovate[bot]') }}
          IS_PR_REVIEW_ELIGIBLE: ${{ github.event_name == 'pull_request_review' && !endsWith(github.event.sender.login, '-bot') && !endsWith(github.event.sender.login, '[bot]') }}
          IS_COMMENT_RERUN: ${{ github.event_name == 'issue_comment' && github.event.issue.pull_request != null && contains(github.event.comment.body, '@eth-bot rerun') }}
        run: |
          set -euo pipefail
          pr_number=""
          case "$EVENT_NAME" in
            pull_request_target)
              [ "$IS_PR_TARGET_ELIGIBLE" = "true" ] && pr_number="$PR_TARGET_NUMBER"
              ;;
            pull_request_review)
              [ "$IS_PR_REVIEW_ELIGIBLE" = "true" ] && pr_number="$PR_REVIEW_NUMBER"
              ;;
            workflow_dispatch)
              pr_number="$DISPATCH_NUMBER"
              ;;
            issue_comment)
              [ "$IS_COMMENT_RERUN" = "true" ] && pr_number="$ISSUE_NUMBER"
              ;;
          esac

          if [ -z "$pr_number" ]; then
            echo "No PR number applies to this event ($EVENT_NAME); skipping review bot."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! echo "$pr_number" | grep -qE '^[0-9]+$'; then
            echo "::error::Invalid PR number determined for event $EVENT_NAME: '$pr_number'"
            exit 1
          fi

          echo "$pr_number" > pr-number.txt
          echo "should_run=true" >> "$GITHUB_OUTPUT"

      - name: Save PR Number
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.pr.outputs.should_run == 'true'
        with:
          name: pr-number
          path: pr-number.txt
          if-no-files-found: error
