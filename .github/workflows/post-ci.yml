on:
  workflow_run:
    workflows:
      - Continuous Integration
    types:
      - completed

name: Post CI

# This is adapted from https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#workflow_run (2022-07-17)

jobs:
  on-failure:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch PR Data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_id="$(gh api repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/artifacts --jq '.artifacts[] | select(.name == "pr_number") | .id' | head -n 1)"

          if [ -z "$artifact_id" ]; then
            echo "pr_number artifact not found for workflow run ${{ github.event.workflow_run.id }}"
            exit 1
          fi

          gh api repos/${{ github.repository }}/actions/artifacts/$artifact_id/zip > pr_number.zip
          unzip -o pr_number.zip
          rm -f pr_number.zip

      - name: Save PR Data
        id: save-pr-data
        run: |
          echo "pr_number=$(cat pr/pr_number)" >> "$GITHUB_OUTPUT"
          echo "pr_sha=$(cat pr/pr_sha)" >> "$GITHUB_OUTPUT"
          echo "merge_sha=$(cat pr/merge_sha)" >> "$GITHUB_OUTPUT"

      - name: Add Comment
        uses: marocchino/sticky-pull-request-comment@39c5b5dc7717447d0cba270cd115037d32d28443
        if: ${{ github.event.workflow_run.conclusion == 'failure' }}
        with:
          number: ${{ steps.save-pr-data.outputs.pr_number }}
          recreate: true
          message: |
            The commit ${{ steps.save-pr-data.outputs.pr_sha }} (as a parent of ${{ steps.save-pr-data.outputs.merge_sha }}) contains errors.
            Please inspect the [Run Summary](https://github.com/ethereum/EIPs/pull/${{ steps.save-pr-data.outputs.pr_number }}/files) for details.

      - name: Add Waiting Label
        uses: actions-ecosystem/action-add-labels@288072f1a3b596f4350fe135bcfe381a23abadef
        if: ${{ github.event.workflow_run.conclusion == 'failure' }}
        with:
          labels: w-ci
          number: ${{ steps.save-pr-data.outputs.pr_number }}
          repo: ${{ github.repository }}
          github_token: ${{ github.token }}

      - name: Remove Waiting Label
        uses: actions-ecosystem/action-remove-labels@d05162525702062b6bdef750ed8594fc024b3ed7
        if: ${{ github.event.workflow_run.conclusion != 'failure' }}
        with:
          labels: w-ci
          number: ${{ steps.save-pr-data.outputs.pr_number }}
          repo: ${{ github.repository }}
          github_token: ${{ github.token }}
