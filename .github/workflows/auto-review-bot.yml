on:
  workflow_run:
    workflows:
      - Auto Review Bot Trigger
    types:
      - completed

name: Auto Review Bot

permissions:
  contents: read

jobs:
  auto-review-bot:
    runs-on: ubuntu-latest
    name: Run
    steps:
      - name: Fetch PR Number
        id: fetch-pr-number
        uses: dawidd6/action-download-artifact@57aa996fc1713cc1579039614f4645a7f4841fd4 # v23
        with:
          name: pr-number
          workflow: auto-review-trigger.yml
          run_id: ${{ github.event.workflow_run.id }}
          if_no_artifact_found: ignore

      - name: Save PR Number
        id: save-pr-number
        if: steps.fetch-pr-number.outputs.found_artifact == 'true'
        run: |
          test -f pr-number.txt
          echo "pr=$(cat pr-number.txt)" >> "$GITHUB_OUTPUT"

      - name: Auto Review Bot
        id: auto-review-bot
        if: steps.save-pr-number.outputs.pr != ''
        uses: ethereum/eip-review-bot@bbc63d4bd02da30703f166f15283ae2eed05916b # dist
        continue-on-error: true
        with:
          token: ${{ secrets.TOKEN }}
          config: config/eip-editors.yml
          pr_number: ${{ steps.save-pr-number.outputs.pr }}
