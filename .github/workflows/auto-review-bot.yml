on:
  workflow_run:
    workflows:
      - Auto Review Bot Trigger
    types:
      - completed

name: Auto Review Bot
jobs:
  auto-review-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Run
    permissions:
      actions: read
      contents: read
    steps:
      - name: Fetch PR Number
        id: fetch-pr-number
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: pr-number
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          if-no-artifact-found: ignore

      - name: Check PR Number file
        id: check-pr-number
        run: |
          if [[ -f pr-number.txt ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save PR Number
        id: save-pr-number
        if: ${{ steps.check-pr-number.outputs.exists == 'true' }}
        run: echo "pr=$(cat pr-number.txt)" >> "$GITHUB_OUTPUT"

      - name: Auto Review Bot
        id: auto-review-bot
        uses: ethereum/eip-review-bot@5836f86feabefae5640ea1380d08eb2725d4d163 # dist
        if: ${{ steps.check-pr-number.outputs.exists == 'true' }}
        with:
          token: ${{ secrets.TOKEN }}
          config: config/eip-editors.yml
          pr_number: ${{ steps.save-pr-number.outputs.pr }}
