on:
  workflow_run:
    workflows:
      - Auto Review Bot Trigger
    types:
      - completed

name: Auto Review Bot

permissions:
  actions: read
  contents: read

jobs:
  auto-review-bot:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      (
        github.event.workflow_run.event == 'pull_request_target' ||
        github.event.workflow_run.event == 'pull_request_review' ||
        github.event.workflow_run.event == 'workflow_dispatch' ||
        github.event.workflow_run.event == 'issue_comment'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout EIP Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Fetch PR Number
        id: fetch-pr-number
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if ! pr_number="$(.github/fetch-pr-number-from-run.sh "${{ github.event.workflow_run.id }}" "${{ github.repository }}")"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "exists=true" >> "$GITHUB_OUTPUT"
          echo "pr=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Auto Review Bot
        if: steps.fetch-pr-number.outputs.exists == 'true'
        id: auto-review-bot
        uses: ethereum/eip-review-bot@dist
        continue-on-error: true
        with:
          token: ${{ secrets.TOKEN }}
          config: config/eip-editors.yml
          pr_number: ${{ steps.fetch-pr-number.outputs.pr }}