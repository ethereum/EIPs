on:
  workflow_run:
    workflows:
      - Auto Review Bot Trigger
    types:
      - completed

name: Auto Review Bot
jobs:
  auto-review-bot:
    runs-on: ubuntu-latest
    name: Run
    permissions:
      actions: read
      contents: read
    steps:
      - name: Fetch PR Number
        id: fetch-pr-number
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_id="$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/artifacts" \
            --jq '.artifacts[] | select(.name == "pr_number" or .name == "pr-number") | .id' \
            | head -n 1)"

          if [[ -z "$artifact_id" ]]; then
            echo "PR number artifact not found for workflow run ${{ github.event.workflow_run.id }}"
            exit 0
          fi

          gh api "repos/${{ github.repository }}/actions/artifacts/$artifact_id/zip" > pr-number.zip
          unzip -o pr-number.zip
          rm -f pr-number.zip

      - name: Check PR Number file
        id: check-pr-number
        run: |
          if [[ -f pr-number.txt ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save PR Number
        id: save-pr-number
        if: ${{ steps.check-pr-number.outputs.exists == 'true' }}
        run: echo "pr=$(cat pr-number.txt)" >> $GITHUB_OUTPUT

      - name: Auto Review Bot
        id: auto-review-bot
        uses: ethereum/eip-review-bot@dist
        if: ${{ steps.check-pr-number.outputs.exists == 'true' }}
        continue-on-error: true
        with:
          token: ${{ secrets.TOKEN }}
          config: config/eip-editors.yml
          pr_number: ${{ steps.save-pr-number.outputs.pr }}
