on:
  workflow_run:
    workflows:
      - Auto Review Bot Trigger
    types:
      - completed

name: Auto Review Bot
jobs:
  auto-review-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Run
    permissions:
      actions: read
      contents: read
    steps:
      - name: Find PR Number artifact
        id: find-pr-number
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          artifact_id="$(gh api --paginate "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name == "pr-number") | .id')"
          if [[ -z "$artifact_id" ]]; then
            echo "::notice::No PR-number artifact was uploaded; skipping review."
          fi
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"

      - name: Fetch PR Number
        id: fetch-pr-number
        if: steps.find-pr-number.outputs.artifact_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ steps.find-pr-number.outputs.artifact_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Check PR Number file
        id: check-pr-number
        if: steps.find-pr-number.outputs.artifact_id != ''
        run: |
          if [[ -f pr-number.txt ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::PR-number artifact is missing pr-number.txt"
            exit 1
          fi

      - name: Save PR Number
        id: save-pr-number
        if: ${{ steps.check-pr-number.outputs.exists == 'true' }}
        run: echo "pr=$(cat pr-number.txt)" >> "$GITHUB_OUTPUT"

      - name: Auto Review Bot
        id: auto-review-bot
        uses: ethereum/eip-review-bot@5836f86feabefae5640ea1380d08eb2725d4d163 # dist
        if: ${{ steps.check-pr-number.outputs.exists == 'true' }}
        with:
          token: ${{ secrets.TOKEN }}
          config: config/eip-editors.yml
          pr_number: ${{ steps.save-pr-number.outputs.pr }}
